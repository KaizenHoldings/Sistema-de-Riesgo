{# Distintivo con punto de color. Reemplaza a utils._dot_badge en las vistas
   refactorizadas; conserva exactamente su paleta y su forma. #}
<span class="kfg-tpl-badge" style="background:{{ bg }};color:{{ fg }}">
  <span class="kfg-tpl-badge__dot" style="background:{{ dot }}"></span>{{ text }}
</span>
