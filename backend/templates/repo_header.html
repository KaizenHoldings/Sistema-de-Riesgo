{# Cabecera del repositorio documental del cliente. #}
<div class="kfg-tpl-card" style="margin-bottom:12px">
  <div class="kfg-tpl-card__head" style="margin-bottom:0">
    <div class="kfg-tpl-card__icon">{{ icono|safe }}</div>
    <div>
      <div class="kfg-tpl-card__title">{{ titulo }}</div>
      <div class="kfg-tpl-card__subtitle">
        Destino: <strong>{{ destino }}</strong>&nbsp;·&nbsp;Proveedor: <strong>{{ proveedor }}</strong>
      </div>
    </div>
  </div>
</div>
