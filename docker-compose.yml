services:
  # ── Base de datos SQL Server 2022 ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kfg_risk_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-KfgRisk2026!Secure}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-KfgRisk2026!Secure}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - kfg_network

  # ── Backend FastAPI (Python 3.11 + MS ODBC Driver 18) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kfg_risk_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Asegurar ruta Linux para almacenamiento en contenedor (montado en /app/clients)
      KFG_BASE_STORAGE_PATH: /app
    volumes:
      # Persistencia de documentos de clientes almacenados localmente
      - ./backend/clients:/app/clients
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kfg_network

  # ── Frontend Next.js (Standalone) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kfg_risk_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Dirección interna del backend en la red de Docker (BFF proxy)
      BACKEND_ORIGIN: http://backend:8000
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kfg_network

networks:
  kfg_network:
    driver: bridge

volumes:
  sqlserver_data:
